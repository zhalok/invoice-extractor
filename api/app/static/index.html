<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice Intake</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 1.5rem; }
  .row { display: flex; gap: 0.75rem; align-items: center; }
  label { font-size: 0.9rem; }
  button { cursor: pointer; padding: 6px 14px; border-radius: 4px; border: 1px solid #999; background: white; }
  button:hover { background: #f0f0f0; }
  #status { margin-top: 1.5rem; }
  .status { padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
  .status-done { background: #d4f4dd; color: #16642e; }
  .status-failed { background: #fddede; color: #9c1c1c; }
  .status-needs_review { background: #fff2cc; color: #8a6300; }
  .status-verified { background: #dbe9ff; color: #1a4d99; }
  .status-queued, .status-extracting, .status-hydrating, .status-verifying, .status-registering, .status-submitting { background: #eee; color: #555; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: #555; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  textarea { width: 100%; height: 220px; font-family: monospace; font-size: 0.8rem; box-sizing: border-box; }
  .issues { background: #fff2cc; border-radius: 4px; padding: 0.5rem 0.8rem; margin: 0.5rem 0; }
  .issues li { font-size: 0.85rem; }
  a { color: #1a4d99; }
</style>
</head>
<body>

<h1>Invoice Intake</h1>

<div class="row">
  <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png">
  <label><input type="checkbox" id="autoSubmit"> auto_submit</label>
  <button id="uploadBtn" onclick="upload()">Upload</button>
</div>

<div id="status"></div>

<p><a href="/jobs">View all jobs &rarr;</a></p>

<script>
const $ = (id) => document.getElementById(id);
let pollTimer = null;

async function upload() {
  const f = $('file').files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  fd.append('auto_submit', $('autoSubmit').checked);

  $('uploadBtn').disabled = true;
  $('status').innerHTML = `<p><span class="spinner"></span>uploading...</p>`;

  const resp = await fetch('/api/jobs', { method: 'POST', body: fd });
  const data = await resp.json();
  $('file').value = '';
  $('uploadBtn').disabled = false;

  if (!resp.ok) {
    $('status').innerHTML = `<p>error: ${JSON.stringify(data)}</p>`;
    return;
  }

  pollJob(data.job_id);
}

const AWAITING_REVIEW = new Set(['verified', 'needs_review']);
const TERMINAL = new Set(['done', 'failed']);

function issuesList(issues) {
  if (!issues || issues.length === 0) return '';
  return `<div class="issues"><strong>Issues:</strong><ul>${issues.map(i => `<li>${i.code}: ${i.message}</li>`).join('')}</ul></div>`;
}

function pollJob(jobId) {
  if (pollTimer) clearInterval(pollTimer);

  const tick = async () => {
    const resp = await fetch(`/api/jobs/${jobId}`);
    const job = await resp.json();

    if (AWAITING_REVIEW.has(job.status)) {
      clearInterval(pollTimer);
      renderReview(job);
    } else if (TERMINAL.has(job.status)) {
      clearInterval(pollTimer);
      renderResult(job);
    } else {
      $('status').innerHTML = `<p><span class="spinner"></span>job ${jobId}: <span class="status status-${job.status}">${job.status}</span></p>`;
    }
  };

  tick();
  pollTimer = setInterval(tick, 1200);
}

function renderReview(job) {
  const payload = job.verification?.payload || job.hydration?.payload || null;
  const issues = job.verification?.issues || job.hydration?.issues || [];

  $('status').innerHTML = `
    <h2>${job.filename} <span class="status status-${job.status}">${job.status}</span></h2>
    ${issuesList(issues)}
    <p>Review / correct the payload below, then submit:</p>
    <textarea id="payloadEditor">${JSON.stringify(payload, null, 2)}</textarea>
    <p><button onclick="submitJob('${job.id}')">Submit to accounting system</button></p>
  `;
}

function renderResult(job) {
  const registration = job.registration ? JSON.stringify(job.registration, null, 2) : null;
  $('status').innerHTML = `
    <h2>${job.filename} <span class="status status-${job.status}">${job.status}</span></h2>
    ${job.error ? `<p>${job.error}</p>` : ''}
    ${registration ? `<pre>${registration}</pre>` : ''}
  `;
}

async function submitJob(jobId) {
  let payload;
  try {
    payload = JSON.parse($('payloadEditor').value);
  } catch (e) {
    alert('Invalid JSON: ' + e.message);
    return;
  }
  $('status').innerHTML = `<p><span class="spinner"></span>submitting...</p>`;
  const resp = await fetch(`/api/jobs/${jobId}/submit`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ payload }),
  });
  if (!resp.ok) {
    const data = await resp.json();
    $('status').innerHTML = `<p>error: ${JSON.stringify(data)}</p>`;
    return;
  }
  pollJob(jobId);
}
</script>
</body>
</html>
