<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice Intake</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 1.5rem; }
  .row { display: flex; gap: 0.75rem; align-items: center; }
  label { font-size: 0.9rem; }
  button { cursor: pointer; padding: 6px 14px; border-radius: 4px; border: 1px solid #999; background: white; }
  button:hover { background: #f0f0f0; }
  button.secondary { border-color: #ccc; font-size: 0.8rem; padding: 3px 8px; }
  #status { margin-top: 1.5rem; }
  .status { padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
  .status-done { background: #d4f4dd; color: #16642e; }
  .status-failed { background: #fddede; color: #9c1c1c; }
  .status-needs_review { background: #fff2cc; color: #8a6300; }
  .status-verified { background: #dbe9ff; color: #1a4d99; }
  .status-queued, .status-extracting, .status-hydrating, .status-verifying, .status-registering, .status-submitting { background: #eee; color: #555; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: #555; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .issues { background: #fff2cc; border-radius: 4px; padding: 0.5rem 0.8rem; margin: 0.5rem 0; }
  .issues li { font-size: 0.85rem; }
  a { color: #1a4d99; }

  form.review { display: flex; flex-direction: column; gap: 0.9rem; }
  .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label { font-size: 0.75rem; color: #555; }
  .field input, .field select { padding: 4px 6px; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 4px; }

  table.lines { width: 100%; border-collapse: collapse; }
  table.lines th { text-align: left; font-size: 0.75rem; color: #555; font-weight: 500; padding: 2px 4px; }
  table.lines td { padding: 2px 4px; }
  table.lines input, table.lines select { width: 100%; box-sizing: border-box; padding: 4px 6px; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 4px; }
  table.lines input.amount, table.lines input.qty, table.lines input.price { text-align: right; }
</style>
</head>
<body>

<h1>Invoice Intake</h1>

<div class="row">
  <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png">
  <label><input type="checkbox" id="autoSubmit"> auto_submit</label>
  <button id="uploadBtn" onclick="upload()">Upload</button>
</div>

<div id="status"></div>

<p><a href="/jobs">View all jobs &rarr;</a></p>

<script>
const $ = (id) => document.getElementById(id);
let pollTimer = null;
let partnersCache = null;
let taxCodesCache = null;

async function loadReferenceData() {
  if (!partnersCache) partnersCache = await (await fetch('/api/partners')).json();
  if (!taxCodesCache) taxCodesCache = await (await fetch('/api/tax-codes')).json();
}

async function upload() {
  const f = $('file').files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  fd.append('auto_submit', $('autoSubmit').checked);

  $('uploadBtn').disabled = true;
  $('status').innerHTML = `<p><span class="spinner"></span>uploading...</p>`;

  const resp = await fetch('/api/jobs', { method: 'POST', body: fd });
  const data = await resp.json();
  $('file').value = '';
  $('uploadBtn').disabled = false;

  if (!resp.ok) {
    $('status').innerHTML = `<p>error: ${JSON.stringify(data)}</p>`;
    return;
  }

  pollJob(data.job_id);
}

const AWAITING_REVIEW = new Set(['verified', 'needs_review']);
const TERMINAL = new Set(['done', 'failed']);

function issuesList(issues) {
  if (!issues || issues.length === 0) return '';
  return `<div class="issues"><strong>Issues:</strong><ul>${issues.map(i => `<li>${i.code}: ${i.message}</li>`).join('')}</ul></div>`;
}

function pollJob(jobId) {
  if (pollTimer) clearInterval(pollTimer);

  const tick = async () => {
    const resp = await fetch(`/api/jobs/${jobId}`);
    const job = await resp.json();

    if (AWAITING_REVIEW.has(job.status)) {
      clearInterval(pollTimer);
      renderReview(job);
    } else if (TERMINAL.has(job.status)) {
      clearInterval(pollTimer);
      renderResult(job);
    } else {
      $('status').innerHTML = `<p><span class="spinner"></span>job ${jobId}: <span class="status status-${job.status}">${job.status}</span></p>`;
    }
  };

  tick();
  pollTimer = setInterval(tick, 1200);
}

function optionsHtml(options, selected) {
  return options.map(o => `<option value="${o.value}" ${o.value === selected ? 'selected' : ''}>${o.label}</option>`).join('');
}

function lineRowHtml(line, taxCodeOptions) {
  const l = line || { description: '', quantity: null, unit: '', unit_price: null, amount: 0, tax_code: taxCodeOptions[0]?.value };
  return `
    <tr>
      <td><input type="text" class="description" value="${l.description ?? ''}"></td>
      <td><input type="number" class="qty" value="${l.quantity ?? ''}" placeholder="—"></td>
      <td><input type="text" class="unit" value="${l.unit ?? ''}"></td>
      <td><input type="number" class="price" value="${l.unit_price ?? ''}" placeholder="—"></td>
      <td><input type="number" class="amount" value="${l.amount ?? 0}"></td>
      <td><select class="tax_code">${optionsHtml(taxCodeOptions, l.tax_code)}</select></td>
      <td><button type="button" class="secondary" onclick="this.closest('tr').remove()">remove</button></td>
    </tr>
  `;
}

async function renderReview(job) {
  await loadReferenceData();

  const payload = job.verification?.payload || job.hydration?.payload || {
    partner_code: null, invoice_number: '', issue_date: '', due_date: '',
    currency: 'JPY', lines: [], subtotal: 0, tax_amount: 0, total_amount: 0,
  };
  const issues = job.verification?.issues || job.hydration?.issues || [];

  const partnerOptions = [{ value: '', label: '(unresolved -- pick one)' },
    ...partnersCache.map(p => ({ value: p.partner_code, label: `${p.name} (${p.partner_code})` }))];
  const taxCodeOptions = taxCodesCache.map(t => ({ value: t.tax_code, label: `${t.tax_code} (${t.label})` }));

  $('status').innerHTML = `
    <h2>${job.filename} <span class="status status-${job.status}">${job.status}</span></h2>
    ${issuesList(issues)}
    <form class="review" onsubmit="return false">
      <div class="field-grid">
        <div class="field"><label>Partner</label>
          <select id="f_partner_code">${optionsHtml(partnerOptions, payload.partner_code)}</select>
        </div>
        <div class="field"><label>Invoice number</label>
          <input type="text" id="f_invoice_number" value="${payload.invoice_number ?? ''}">
        </div>
        <div class="field"></div>
        <div class="field"><label>Issue date</label>
          <input type="date" id="f_issue_date" value="${payload.issue_date ?? ''}">
        </div>
        <div class="field"><label>Due date</label>
          <input type="date" id="f_due_date" value="${payload.due_date ?? ''}">
        </div>
        <div class="field"></div>
      </div>

      <table class="lines">
        <thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Unit price</th><th>Amount</th><th>Tax</th><th></th></tr></thead>
        <tbody id="lineRows">${payload.lines.map(l => lineRowHtml(l, taxCodeOptions)).join('')}</tbody>
      </table>
      <button type="button" class="secondary" onclick="addLineRow()">+ add line</button>

      <div class="field-grid">
        <div class="field"><label>Subtotal</label>
          <input type="number" id="f_subtotal" value="${payload.subtotal ?? 0}">
        </div>
        <div class="field"><label>Tax amount</label>
          <input type="number" id="f_tax_amount" value="${payload.tax_amount ?? 0}">
        </div>
        <div class="field"><label>Total amount</label>
          <input type="number" id="f_total_amount" value="${payload.total_amount ?? 0}">
        </div>
      </div>

      <p><button onclick="submitJob('${job.id}')">Submit to accounting system</button></p>
    </form>
  `;

  window._taxCodeOptions = taxCodeOptions;
}

function addLineRow() {
  $('lineRows').insertAdjacentHTML('beforeend', lineRowHtml(null, window._taxCodeOptions));
}

function num(el) {
  const v = el.value.trim();
  return v === '' ? null : Number(v);
}

function collectPayload() {
  const lines = [...document.querySelectorAll('#lineRows tr')].map(tr => ({
    description: tr.querySelector('.description').value,
    quantity: num(tr.querySelector('.qty')),
    unit: tr.querySelector('.unit').value,
    unit_price: num(tr.querySelector('.price')),
    amount: num(tr.querySelector('.amount')) ?? 0,
    tax_code: tr.querySelector('.tax_code').value,
  }));

  return {
    partner_code: $('f_partner_code').value,
    invoice_number: $('f_invoice_number').value,
    issue_date: $('f_issue_date').value,
    due_date: $('f_due_date').value,
    currency: 'JPY',
    lines,
    subtotal: num($('f_subtotal')) ?? 0,
    tax_amount: num($('f_tax_amount')) ?? 0,
    total_amount: num($('f_total_amount')) ?? 0,
  };
}

function renderResult(job) {
  const registration = job.registration ? JSON.stringify(job.registration, null, 2) : null;
  $('status').innerHTML = `
    <h2>${job.filename} <span class="status status-${job.status}">${job.status}</span></h2>
    ${job.error ? `<p>${job.error}</p>` : ''}
    ${registration ? `<pre>${registration}</pre>` : ''}
  `;
}

async function submitJob(jobId) {
  const payload = collectPayload();
  if (!payload.partner_code) {
    alert('Please select a partner.');
    return;
  }
  $('status').innerHTML = `<p><span class="spinner"></span>submitting...</p>`;
  const resp = await fetch(`/api/jobs/${jobId}/submit`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ payload }),
  });
  if (!resp.ok) {
    const data = await resp.json();
    $('status').innerHTML = `<p>error: ${JSON.stringify(data)}</p>`;
    return;
  }
  pollJob(jobId);
}
</script>
</body>
</html>
